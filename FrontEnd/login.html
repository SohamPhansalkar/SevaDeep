<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | SevaDeep</title>

    <link rel="icon" type="image/png" href="images/sevadeep-logo.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-sm navbar-seva">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="images/sevadeep-logo.png" alt="SevaDeep" />
        </a>
        <a href="signup.html" class="btn-seva btn-seva--small">Sign up</a>
      </div>
    </nav>

    <main class="auth-page">
      <div class="container">
        <div class="auth-card">
          <!-- Heading with icon in a red circle -->
          <div class="text-center mb-4">
            <span class="icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
              </svg>
            </span>
            <h1>Welcome back</h1>
            <p class="mb-0">Log in to view your attendance.</p>
          </div>

          <!-- Log-in form (frontend only: script.js reads it, nothing is sent yet) -->
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                autocomplete="current-password"
                required
              />
            </div>

            <!-- Fake "I am not a robot": just a required checkbox, nothing is verified -->
            <div class="robot-check mb-4">
              <input type="checkbox" id="notRobot" required />
              <label for="notRobot">I'm not a robot</label>
            </div>

            <button type="submit" class="btn-seva w-100">Log in</button>

            <!-- script.js writes the status message here -->
            <p id="formMessage" class="form-message" role="alert"></p>
          </form>

          <p class="auth-switch">
            New volunteer? <a href="signup.html">Sign up</a>
          </p>
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
      <div class="container">
        <p class="footer-title">Project by</p>
        <ul class="footer-team">
          <li><strong>Soham Phansalkar</strong><span>24070122202</span></li>
          <li><strong>Shubham Chitrakar</strong><span>24070122195</span></li>
          <li><strong>Talib Jiruwala</strong><span>24070122215</span></li>
          <li><strong>Tanmay Sheware</strong><span>24070122216</span></li>
        </ul>
        <p class="footer-college">SIT, Pune : CSE C1</p>
      </div>
    </footer>

    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
