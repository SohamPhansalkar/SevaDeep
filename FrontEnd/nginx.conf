server {
    # Listen for incoming traffic on port 80 (the standard web port)
    listen 80;
    
    # Rule 1: Serve the frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Rule 2: The Reverse Proxy
    # Any request starting with /api/ gets forwarded to the backend container
    location /api/ {
        # The trailing slash is crucial: it strips "/api" off the URL 
        # so FastAPI just receives "/login" instead of "/api/login"
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}