server {
    listen 80;
    
    # Forces a trailing slash so relative HTML paths don't break
    location = /sevadeep {
        return 301 /sevadeep/;
    }

    # Serves your static files when the URL contains /sevadeep/
    location /sevadeep/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    # Proxies API requests to FastAPI, stripping /sevadeep/api/ down to just /
    location /sevadeep/api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}