<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up | SevaDeep</title>

    <link rel="icon" type="image/png" href="./images/sevadeep-logo.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-sm navbar-seva">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="./images/sevadeep-logo.png" alt="SevaDeep" />
        </a>
        <a href="login.html" class="btn-seva btn-seva--dark btn-seva--small"
          >Log in</a
        >
      </div>
    </nav>

    <main class="auth-page">
      <div class="container">
        <div class="auth-card">
          <!-- Heading with icon in a red circle -->
          <div class="text-center mb-4">
            <span class="icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="20" y1="8" x2="20" y2="14" />
                <line x1="23" y1="11" x2="17" y2="11" />
              </svg>
            </span>
            <h1>Create your account</h1>
            <p class="mb-0">Register as a SevaDeep volunteer.</p>
          </div>

          <!-- Sign-up form (frontend only: script.js reads it, nothing is sent yet) -->
          <form id="signupForm">
            <!-- First name and last name side by side -->
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="firstName" class="form-label">First name</label>
                <input
                  type="text"
                  class="form-control"
                  id="firstName"
                  autocomplete="given-name"
                  required
                />
              </div>
              <div class="col-sm-6">
                <label for="lastName" class="form-label">Last name</label>
                <input
                  type="text"
                  class="form-control"
                  id="lastName"
                  autocomplete="family-name"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="mb-3">
              <label for="contactNumber" class="form-label"
                >Contact number</label
              >
              <!-- pattern: exactly 10 digits -->
              <input
                type="tel"
                class="form-control"
                id="contactNumber"
                pattern="[0-9]{10}"
                maxlength="10"
                inputmode="numeric"
                title="Enter a 10-digit mobile number"
                autocomplete="tel"
                required
              />
            </div>

            <div class="mb-3">
              <label for="gender" class="form-label">Gender</label>
              <select class="form-select" id="gender" required>
                <option value="" selected disabled>Select gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Prefer not to say</option>
              </select>
            </div>

            <!-- Not required -->
            <div class="mb-4">
              <label for="institution" class="form-label"
                >School / college name (optional)</label
              >
              <input type="text" class="form-control" id="institution" />
            </div>

            <button type="submit" class="btn-seva w-100">Sign up</button>

            <!-- script.js writes the status message here -->
            <p id="formMessage" class="form-message" role="alert"></p>
          </form>

          <p class="auth-switch">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
      <div class="container">
        <p class="footer-title">Project by</p>
        <ul class="footer-team">
          <li><strong>Soham Phansalkar</strong><span>24070122202</span></li>
          <li><strong>Shubham Chitrakar</strong><span>24070122195</span></li>
          <li><strong>Talib Jiruwala</strong><span>24070122215</span></li>
          <li><strong>Tanmay Sheware</strong><span>24070122216</span></li>
        </ul>
        <p class="footer-college">SIT, Pune : CSE C1</p>
      </div>
    </footer>

    <script src="./script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
