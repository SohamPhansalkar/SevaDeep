    <!-- ===== MAIN CONTENT ===== -->
    <main class="auth-page">
      <div class="container">
        <div class="auth-card">
          <!-- Heading with icon in a red circle -->
          <div class="text-center mb-4">
            <span class="icon-circle" aria-hidden="true">
              <!-- Calendar / Check Icon -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
                <path d="m9 16 2 2 4-4" />
              </svg>
            </span>
            <h1>Record Attendance</h1>
            <p class="mb-0">Log hours and activity details for your group.</p>
          </div>

          <!-- Add Attendance Form -->
          <form id="attendanceForm">
            <!-- 1. Activity Date -->
            <div class="mb-3">
              <label for="activityDate" class="form-label">Activity date</label>
              <input
                type="date"
                class="form-control"
                id="activityDate"
                required
              />
            </div>

            <!-- 2. Hours Worked -->
            <div class="mb-3">
              <label for="hoursWorked" class="form-label"
                >Hours worked / duration</label
              >
              <input
                type="number"
                class="form-control"
                id="hoursWorked"
                min="0.5"
                step="0.5"
                placeholder="e.g., 2.5"
                required
              />
            </div>

            <!-- 3. Activity Name -->
            <div class="mb-3">
              <label for="activityName" class="form-label">Activity name</label>
              <input
                type="text"
                class="form-control"
                id="activityName"
                placeholder="e.g., Food Distribution Drive"
                required
              />
            </div>

            <!-- 4. Remarks / Note (Optional) -->
            <div class="mb-4">
              <label for="activityNote" class="form-label"
                >Note / remarks (optional)</label
              >
              <textarea
                class="form-control"
                id="activityNote"
                rows="3"
                placeholder="Additional details or notes about the session..."
              ></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-seva w-100">
              Submit Attendance
            </button>

            <!-- Status message container -->
            <p id="formMessage" class="form-message" role="alert"></p>
          </form>
        </div>
      </div>
    </main>
